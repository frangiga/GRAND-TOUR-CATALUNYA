<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Geo-Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1b2a;
      color: #e0e1dd;
    }

    /* Contenedor Principal (Zero Scroll) */
    .app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      padding: 15px;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* Pantalla de Selección de Idioma */
    #lang-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0d1b2a;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      padding: 20px;
    }

    .lang-title {
      font-size: 1.8rem;
      color: #f77f00;
      text-align: center;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(247, 127, 0, 0.4);
    }

    .lang-buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-lang {
      background: #1b263b;
      color: #e0e1dd;
      border: 2px solid #f77f00;
      padding: 12px 24px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 8px rgba(247, 127, 0, 0.2);
    }

    .btn-lang:active {
      transform: scale(0.95);
      background-color: #f77f00;
      color: #0d1b2a;
      box-shadow: 0 0 15px rgba(247, 127, 0, 0.8);
    }

    /* Cabecera / Marcador */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1b263b;
      padding: 10px 15px;
      border-radius: 8px;
      border-bottom: 2px solid #f77f00;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .score-board {
      font-size: 1rem;
      font-weight: bold;
      color: #e0e1dd;
    }

    .score-value {
      color: #f77f00;
      font-size: 1.2rem;
    }

    /* Tablero de Juego */
    main {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin: 10px 0;
    }

    .status-text {
      font-size: 1.2rem;
      text-align: center;
      min-height: 1.5em;
      color: #7209b7;
      text-shadow: 0 0 8px rgba(114, 9, 183, 0.6);
      font-weight: bold;
    }

    /* Efecto Neón / Brillo */
    .glow-effect {
      box-shadow: 0 0 15px rgba(247, 127, 0, 0.5), inset 0 0 10px rgba(247, 127, 0, 0.3);
    }

    .game-board {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      background: #1b263b;
      border-radius: 12px;
      border: 2px solid #415a77;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .option-btn {
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: transform 0.1s, filter 0.2s;
    }

    .option-btn:active {
      transform: scale(0.96);
    }

    /* Colores de botones */
    .btn-1 { background-color: #f77f00; }
    .btn-2 { background-color: #3a86ff; }
    .btn-3 { background-color: #7209b7; }
    .btn-4 { background-color: #43aa8b; }

    /* Pantalla Final */
    #end-screen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      text-align: center;
      width: 100%;
    }

    .final-msg {
      font-size: 1.5rem;
      color: #f77f00;
      font-weight: bold;
    }

    .code-box {
      background: #1b263b;
      border: 2px dashed #f77f00;
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 1.3rem;
      letter-spacing: 2px;
      color: #e0e1dd;
      box-shadow: 0 0 12px rgba(247, 127, 0, 0.3);
    }

    .btn-restart {
      background: #f77f00;
      color: #0d1b2a;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- SELECTOR DE IDIOMA INICIAL -->
    <div id="lang-screen">
      <div class="lang-title">Elige tu idioma / Choose language</div>
      <div class="lang-buttons">
        <button class="btn-lang" onclick="selectLanguage('es')">Español</button>
        <button class="btn-lang" onclick="selectLanguage('val')">Valencià</button>
        <button class="btn-lang" onclick="selectLanguage('en')">English</button>
      </div>
    </div>

    <!-- CABECERA -->
    <header>
      <div class="score-board">
        <span id="label-round">Ronda:</span> <span id="current-round" class="score-value">1</span>/<span id="total-rounds" class="score-value">7</span>
      </div>
      <div class="score-board">
        <span id="label-score">Puntos:</span> <span id="current-score" class="score-value">0</span>
      </div>
    </header>

    <!-- ÁREA DE JUEGO -->
    <main id="game-area">
      <div id="status-text" class="status-text">¡Sigue la secuencia!</div>
      
      <div class="game-board glow-effect">
        <button class="option-btn btn-1" onclick="handleChoice(0)"></button>
        <button class="option-btn btn-2" onclick="handleChoice(1)"></button>
        <button class="option-btn btn-3" onclick="handleChoice(2)"></button>
        <button class="option-btn btn-4" onclick="handleChoice(3)"></button>
      </div>
    </main>

    <!-- PANTALLA DE RESULTADO FINAL -->
    <div id="end-screen">
      <div class="final-msg" id="final-status">¡Enhorabuena!</div>
      <p id="final-desc">Has completado las 7 rondas con éxito.</p>
      <div class="code-box" id="final-code">GEO-777</div>
      <button class="btn-restart" id="btn-restart" onclick="restartGame()">Jugar de nuevo</button>
    </div>

  </div>

  <script>
    // CONFIGURACIÓN DE RONDAS (Ajustado a 7 para muggles y agilizar)
    const TOTAL_RONDAS = 7;

    // TEXTOS Y TRADUCCIONES
    const i18n = {
      es: {
        round: "Ronda:",
        score: "Puntos:",
        status: "¡Tu turno!",
        winTitle: "¡Excelente trabajo!",
        winDesc: "Has superado las 7 rondas sin problemas.",
        loseTitle: "¡Oh no!",
        loseDesc: "Has fallado. Inténtalo de nuevo.",
        restart: "Reintentar",
        code: "GEO-FINAL-LOG"
      },
      val: {
        round: "Ronda:",
        score: "Punts:",
        status: "El teu torn!",
        winTitle: "Excel·lent treball!",
        winDesc: "Has superat les 7 rondes sense problemes.",
        loseTitle: "Oh no!",
        loseDesc: "Has fallat. Torna-ho a intentar.",
        restart: "Reintentar",
        code: "GEO-FINAL-LOG"
      },
      en: {
        round: "Round:",
        score: "Score:",
        status: "Your turn!",
        winTitle: "Great job!",
        winDesc: "You completed all 7 rounds successfully.",
        loseTitle: "Oh no!",
        loseDesc: "You missed. Try again.",
        restart: "Try Again",
        code: "GEO-FINAL-LOG"
      }
    };

    let currentLang = 'es';
    let currentRound = 1;
    let score = 0;

    function selectLanguage(lang) {
      currentLang = lang;
      document.getElementById('lang-screen').style.display = 'none';
      
      // Aplicar traducciones
      document.getElementById('label-round').innerText = i18n[lang].round;
      document.getElementById('label-score').innerText = i18n[lang].score;
      document.getElementById('status-text').innerText = i18n[lang].status;
      document.getElementById('btn-restart').innerText = i18n[lang].restart;
      
      initGame();
    }

    function initGame() {
      currentRound = 1;
      score = 0;
      document.getElementById('total-rounds').innerText = TOTAL_RONDAS;
      document.getElementById('current-round').innerText = currentRound;
      document.getElementById('current-score').innerText = score;
      document.getElementById('game-area').style.display = 'flex';
      document.getElementById('end-screen').style.display = 'none';
    }

    function handleChoice(optionIndex) {
      // Lógica de avance de ronda
      score += 10;
      document.getElementById('current-score').innerText = score;

      if (currentRound < TOTAL_RONDAS) {
        currentRound++;
        document.getElementById('current-round').innerText = currentRound;
      } else {
        endGame(true);
      }
    }

    function endGame(isWin) {
      document.getElementById('game-area').style.display = 'none';
      const endScreen = document.getElementById('end-screen');
      endScreen.style.display = 'flex';

      if (isWin) {
        document.getElementById('final-status').innerText = i18n[currentLang].winTitle;
        document.getElementById('final-desc').innerText = i18n[currentLang].winDesc;
        document.getElementById('final-code').innerText = i18n[currentLang].code;
        document.getElementById('final-code').style.display = 'block';
      } else {
        document.getElementById('final-status').innerText = i18n[currentLang].loseTitle;
        document.getElementById('final-desc').innerText = i18n[currentLang].loseDesc;
        document.getElementById('final-code').style.display = 'none';
      }
    }

    function restartGame() {
      initGame();
    }
  </script>
</body>
</html>
